start_watering:
  target:
    entity:
      integration: hunter_node_bt
      domain: valve
  fields:
    duration:
      required: true
      example: "00:15:00"
      selector:
        duration:

set_program:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hunter_node_bt
    program:
      required: true
      default: "A"
      selector:
        select:
          options: ["A", "B", "C"]
    start_times:
      example: ["06:30", "16:00"]
      selector:
        text:
          multiple: true
    water_days:
      example: "Mon, Wed, Fri"
      selector:
        text:
    station:
      default: 1
      selector:
        number:
          min: 1
          max: 4
    run_minutes:
      example: 15
      selector:
        number:
          min: 0
          max: 240
          unit_of_measurement: min
